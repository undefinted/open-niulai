name: Bug report
description: Report reproducible CLI, Skill, asset, or provider behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: request
    attributes:
      label: Original request
      description: Remove secrets and private media before posting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Codex Skill, CLI, image workflow, video job, Runway adapter, documentation]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I removed API keys, private URLs, and personal data.
          required: true
        - label: Any attached media is original or I have permission to share it.
          required: true
