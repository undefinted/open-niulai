name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest build
      - name: Run tests
        run: python -m pytest -q
      - name: Check release structure
        run: python scripts/check_release.py
      - name: Build wheel and source archive
        run: python -m build
      - name: Smoke-test installed CLI
        shell: bash
        run: |
          python -m pip install dist/*.whl
          open-niulai --help
