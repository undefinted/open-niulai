[project]
name = "open-niulai"
version = "0.2.0"
description = "Turn any prompt into an original X-lai meme animation production pack"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
open-niulai = "scripts.open_niulai:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
