[project]
name = "open-niulai"
version = "0.4.0"
description = "Turn any prompt into an original X-lai meme animation production pack"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
open-niulai = "scripts.open_niulai:main"
open-niulai-web = "scripts.web_app:main"

[project.optional-dependencies]
local-video = [
  "numpy>=1.24,<2",
  "torch>=2.0",
  "diffusers>=0.35,<0.38",
  "transformers>=4.46,<5",
  "accelerate>=1,<2",
  "safetensors>=0.4",
  "huggingface_hub>=0.27",
  "Pillow>=10",
  "imageio-ffmpeg>=0.5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
